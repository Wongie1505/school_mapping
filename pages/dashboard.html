<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard | Lilongwe School Mapping System</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="../css/style.css">

</head>

<body>

    <!-- ============================= -->
    <!-- NAVIGATION BAR -->
    <!-- ============================= -->

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">

        <div class="container-fluid">

            <a class="navbar-brand fw-bold" href="../index.html">
                <i class="bi bi-geo-alt-fill"></i>
                Lilongwe School GIS
            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#mainNavbar">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="mainNavbar">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="../index.html">
                            <i class="bi bi-map"></i>
                            Map
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="schools.html">
                            <i class="bi bi-building"></i>
                            Schools
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="dashboard.html">
                            <i class="bi bi-bar-chart-fill"></i>
                            Dashboard
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="about.html">
                            <i class="bi bi-info-circle"></i>
                            About
                        </a>
                    </li>

                </ul>

            </div>

        </div>

    </nav>


    <!-- ============================= -->
    <!-- MAIN CONTENT -->
    <!-- ============================= -->

    <main class="container-fluid p-4">

        <h4 class="fw-bold mb-4">
            <i class="bi bi-bar-chart-fill"></i>
            Dashboard
        </h4>

        <!-- Stat cards -->
        <div class="row g-3 mb-4">

            <div class="col-6 col-md-3">
                <div class="stat-card text-center">
                    <h3 id="statTotal">0</h3>
                    <small>Total Schools</small>
                </div>
            </div>

            <div class="col-6 col-md-3">
                <div class="stat-card text-center">
                    <h3 id="statPrimary">0</h3>
                    <small>Primary Schools</small>
                </div>
            </div>

            <div class="col-6 col-md-3">
                <div class="stat-card text-center">
                    <h3 id="statSecondary">0</h3>
                    <small>Secondary Schools</small>
                </div>
            </div>

            <div class="col-6 col-md-3">
                <div class="stat-card text-center">
                    <h3 id="statPublicPrivate">0 / 0</h3>
                    <small>Public / Private</small>
                </div>
            </div>

        </div>


        <!-- Charts -->
        <div class="row g-4">

            <div class="col-md-6">
                <div class="chart-card">
                    <h6 class="fw-bold mb-3">Schools by Level</h6>
                    <canvas id="levelChart" height="220"></canvas>
                </div>
            </div>

            <div class="col-md-6">
                <div class="chart-card">
                    <h6 class="fw-bold mb-3">Schools by Ownership</h6>
                    <canvas id="ownershipChart" height="220"></canvas>
                </div>
            </div>

            <div class="col-12">
                <div class="chart-card">
                    <h6 class="fw-bold mb-3">Level &times; Ownership Breakdown</h6>
                    <canvas id="breakdownChart" height="140"></canvas>
                </div>
            </div>

        </div>

    </main>


    <!-- ============================= -->
    <!-- FOOTER -->
    <!-- ============================= -->

    <footer class="bg-dark text-white text-center py-2">
        <small>
            © 2026 Lilongwe School Mapping System |
            GIS Research Project
        </small>
    </footer>


    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>

    <script src="../js/dashboard.js"></script>

</body>

</html>
