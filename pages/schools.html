<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Schools | Lilongwe School Mapping System</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="../css/style.css">

</head>

<body>

    <!-- ============================= -->
    <!-- NAVIGATION BAR -->
    <!-- ============================= -->

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">

        <div class="container-fluid">

            <a class="navbar-brand fw-bold" href="../index.html">
                <i class="bi bi-geo-alt-fill"></i>
                Lilongwe School GIS
            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#mainNavbar">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="mainNavbar">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="../index.html">
                            <i class="bi bi-map"></i>
                            Map
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="schools.html">
                            <i class="bi bi-building"></i>
                            Schools
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="dashboard.html">
                            <i class="bi bi-bar-chart-fill"></i>
                            Dashboard
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="about.html">
                            <i class="bi bi-info-circle"></i>
                            About
                        </a>
                    </li>

                </ul>

            </div>

        </div>

    </nav>


    <!-- ============================= -->
    <!-- MAIN CONTENT -->
    <!-- ============================= -->

    <main class="container-fluid p-4">

        <h4 class="fw-bold mb-3">
            <i class="bi bi-building"></i>
            All Schools
        </h4>

        <!-- Filter bar -->
        <div class="row g-2 mb-3">

            <div class="col-md-5">
                <div class="input-group">
                    <span class="input-group-text">
                        <i class="bi bi-search"></i>
                    </span>
                    <input
                        type="text"
                        id="tableSearch"
                        class="form-control"
                        placeholder="Search school name...">
                </div>
            </div>

            <div class="col-md-3">
                <select id="tableLevel" class="form-select">
                    <option value="all">All Levels</option>
                    <option value="primary">Primary</option>
                    <option value="secondary">Secondary</option>
                </select>
            </div>

            <div class="col-md-3">
                <select id="tableOwnership" class="form-select">
                    <option value="all">All Schools</option>
                    <option value="public">Public</option>
                    <option value="private">Private</option>
                </select>
            </div>

            <div class="col-md-1 d-flex align-items-center">
                <span id="tableCount" class="small text-muted"></span>
            </div>

        </div>


        <!-- Results table -->
        <div class="table-responsive">

            <table class="table table-hover align-middle bg-white schools-table">

                <thead>
                    <tr>
                        <th data-sort="name" class="sortable">
                            Name <i class="bi bi-arrow-down-up"></i>
                        </th>
                        <th data-sort="level" class="sortable">
                            Level <i class="bi bi-arrow-down-up"></i>
                        </th>
                        <th data-sort="ownership" class="sortable">
                            Ownership <i class="bi bi-arrow-down-up"></i>
                        </th>
                        <th data-sort="type" class="sortable">
                            Type <i class="bi bi-arrow-down-up"></i>
                        </th>
                        <th>Coordinates</th>
                        <th></th>
                    </tr>
                </thead>

                <tbody id="schoolsTableBody">
                    <tr>
                        <td colspan="6" class="text-center text-muted py-4">
                            Loading schools...
                        </td>
                    </tr>
                </tbody>

            </table>

        </div>

    </main>


    <!-- ============================= -->
    <!-- FOOTER -->
    <!-- ============================= -->

    <footer class="bg-dark text-white text-center py-2">
        <small>
            © 2026 Lilongwe School Mapping System |
            GIS Research Project
        </small>
    </footer>


    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <script src="../js/schools-page.js"></script>

</body>

</html>
